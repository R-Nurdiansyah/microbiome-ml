# Grids for cv.mode: run_grid. Every list is searched, so the candidate count
# is the product of the list lengths. Each candidate costs one fit per fold.
# use ~ for None
#
# A model named in cv.models must have a key here, or run_grid stops. An empty
# key (`rf:`) means sklearn's defaults, on purpose.
#
# Widened where the 18S run picked an end of the range. 30 RF and 36 XGB
# candidates.

rf:
  n_estimators: [500]
  # Fit time grows with this; 0.7 and 1.0 are the expensive end.
  max_features: [0.1, 0.33, 0.5, 0.7, 1.0]
  min_samples_leaf: [1, 2, 5]
  # Share of rows each tree draws (~ = all). 0.5 halves fit time and memory.
  max_samples: [0.5, ~]

xgb:
  n_estimators: [1000]
  learning_rate: [0.03, 0.05, 0.1]
  max_depth: [4, 6, 8]
  colsample_bytree: [0.3, 0.5]
  min_child_weight: [1, 5]
  subsample: [0.8]

# SVR with a linear kernel after a MaxAbsScaler (cv.ScaledSVR), so keys take
# the `svr__` prefix. Only used when cv.models lists svm. 10 candidates.
# Fit time grows with the square of the sample count or worse: cap 16S
# (--n-per-label) before adding svm there.
svm:
  svr__kernel: [linear]
  # libsvm sums the loss over samples rather than averaging it, so the same
  # C regularises less as the data grows: wide on purpose. Large C is also
  # the slow end.
  svr__C: [0.01, 0.1, 1, 10, 100]
  # In label units (degrees C here): errors smaller than this cost nothing.
  svr__epsilon: [0.1, 0.5]
