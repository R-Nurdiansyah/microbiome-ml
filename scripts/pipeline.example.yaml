# =============================================================================
# Pipeline config for scripts/run_cv_to_final_eval.py
#
#   pixi run python scripts/run_cv_to_final_eval.py --config pipeline.yaml
#   pixi run -e shap python scripts/run_cv_to_final_eval.py --config ...   # with SHAP
#   ... --set split.holdout.grouping=bioproject --set outputs.base_dir=out/x
#       (override any key from the CLI; repeatable; values parsed as YAML)
#
# Stages, in order:
#   1. data        -> load metadata / profiles / labels
#   2. groupings   -> columns that holdout and CV can split by
#   3. features    -> taxonomic feature tables (the X matrix)
#   4. preprocessing (optional QC)
#   5. split       -> holdout train/test, then CV folds inside train
#   6. cv          -> model selection; best model per label x scheme
#   7. holdout     -> refit each winner on train, score once on test (+ SHAP)
#                     (skippable with holdout_evaluation.enabled: false)
#   8. outputs / visualise
#
# Paths may be absolute or relative to the directory you launch from.
# `null` means "not set / use the default".
# =============================================================================

data:
  # Sample metadata, one row per sample. Must have a `sample` column; the
  # default groupings are read from here (bioproject, biome, ecoregion, ...).
  metadata: /path/to/metadata.csv
  # Long-format sample attributes: columns `sample,key,value`
  # (e.g. SRR123,latitude,40.6). Extra per-sample fields live here.
  attributes: /path/to/attributes.csv
  # Optional CSV of study titles keyed by bioproject/sample. null = none.
  study_titles: null
  # Taxonomic profiles, one row per sample x taxon:
  #   acc,coverage,taxonomy   (taxonomy = "Root; d__...; p__...; c__...; ...")
  # Coverage or relative abundance, filled or unfilled: see
  # features.profile_layout.
  profiles: /path/to/profiles.csv
  # Optional per-sample root coverage CSV (total reads) if not derivable
  # from the profiles. null = not needed.
  root: null
  # Labels to predict. Each CSV has columns `sample,<value>`; the key here
  # becomes the label name used everywhere (outputs, split.*.label, ...).
  # Samples with an empty value are dropped for that label only.
  labels:
    temperature: /path/to/temperature_labels.csv
    ph: /path/to/ph_labels.csv
  # Deprecated: use groupings.file below. Still honoured if groupings: is absent.
  groupings: null

# Grouping columns are what split.holdout.grouping, split.cv.grouping and
# cv.scheme can refer to. Built in this order; nothing is dropped.
groupings:
  # Extract the standard grouping columns from data.metadata:
  #   bioproject, biome, domain, ecoregion, year, month, climate, season
  # Columns missing from your metadata are skipped with a warning.
  defaults: true
  # Any OTHER column of data.metadata to use as a grouping, e.g.
  #   columns: [depth_category, zone, realm]
  # Missing columns are an error (names are checked before the slow stages).
  columns: []
  # CSV with `sample` + custom grouping columns you derived yourself, e.g. a
  # latitude band (`sample,lat_band` / `SRR123,tropical`). Merged on top;
  # a column name that already exists is an error. null = none.
  file: null

features:
  # Build taxonomic feature tables (relative abundance per taxon) from the
  # profiles. These are the model inputs; one feature set per rank.
  add_taxonomic_features: true
  # true  -> one feature set for every rank phylum..species (ignores `ranks`)
  # false -> only the ranks listed below (null = class only)
  all: true
  # e.g. [phylum, class, order, family, genus]. Used when all: false.
  ranks: null
  # Feature-set name prefix: tax -> tax_phylum, tax_class, ...
  prefix: tax
  # How the rows of data.profiles relate (SingleM's glossary terms):
  #   unfilled -> a row holds only the reads assigned to that taxon and no
  #               deeper, so a taxon's total is the sum of every row under
  #               it. SingleM's standard (condensed) output; a table with
  #               one row per species is unfilled too.
  #   filled   -> a row already includes all of its descendants, so a
  #               taxon's total is its own row.
  #   auto     -> (default) decided from the data and logged. Set it when
  #               you know: a wrong guess sums a filled table several times
  #               over, or keeps one row of an unfilled one.
  # Coverage or relative abundance alike; coverage is divided by the
  # per-sample domain total (data.root, if given, instead).
  profile_layout: auto
  # Memory controls for building the wide feature tables. Under the
  # Snakemake workflow each rank is streamed straight to the prepared
  # dataset a chunk of samples at a time, so peak memory is roughly
  # chunk_samples x number of taxa rather than the whole matrix.
  chunk_samples: 5000
  # On-disk format for the streamed feature tables.
  #   csv     -> the default; readable, but a text zero has no dtype, so
  #              polars reads the table back as Float64 -- 8 bytes for
  #              every zero in a 99%-sparse genus matrix.
  #   parquet -> columnar and typed: Float32 survives the round trip, the
  #              file is a fraction of the size, and every later job scans
  #              it instead of re-parsing text. Written as a directory of
  #              row-group parts, <prefix>_<rank>.parquet/.
  # Changing this needs the dataset rebuilt (-R prepare) or the existing
  # tables converted -- see "Converting an existing dataset" in the README.
  format: csv
  # Drop taxa present (non-zero) in fewer than this fraction of samples.
  # null (or absent) = keep every taxon, which is the old behaviour.
  #   0.01 -> present in >=1% of samples. On a 59,443-genus soil table
  #           that keeps ~8,500 columns and 97.6% of the total abundance.
  #   0.05 -> ~2,500 columns, 88.7% of abundance.
  # Unsupervised: it reads abundances only, never a label, so it cannot
  # leak the target. Counted once over the samples being built, not per
  # CV fold. Say so in your methods.
  # Leaves NO suffix on the feature-set name, so two thresholds cannot
  # share a base_dir without overwriting each other. Compare them with
  #   scripts/sweep_transforms.py --min-prevalence 0.01 0.05 0.1
  min_prevalence: null
  # What prevalence counts. null (default) = samples. A grouping column
  # name (e.g. bioproject) counts DISTINCT GROUPS instead: "in how many
  # independent studies does this taxon appear at all", so one large
  # project cannot make a taxon look common on its own. Needs the column
  # under groupings. Names the set <prefix>_<rank>_bio.
  prevalence_by: null
  # How abundances are expressed.
  #   relabund -> the default; values stay relative abundances, which are
  #               a constant-sum composition (every sample adds to 1).
  #   clr      -> centred log-ratio per sample across the taxa kept at
  #               this rank: ln(x + p) minus the mean of those logs.
  #               Puts features on an additive scale, which tree models
  #               and correlations handle more sensibly than proportions.
  #               Names the set <prefix>_<rank>_clr.
  #   presence -> 1 if the taxon is there, 0 if not; abundance is
  #               discarded. Depth and library protocol shift abundances
  #               far more than they shift which taxa are detectable, so
  #               this sheds much of the between-study artefact that a
  #               leave-one-bioproject-out split has to survive.
  #               Names the set <prefix>_<rank>_pa.
  # One value per run, and they cannot share a prepared dataset:
  # Dataset.load reads its feature sets from manifest.json, so a second
  # prepare into the same base_dir rewrites the manifest and orphans the
  # first transform's table on disk. Comparing transforms means one run
  # each into its own base_dir --
  #   scripts/sweep_transforms.py drives that loop and writes one
  #   summary across the runs.
  transform: relabund
  # Added before the log, since the table is mostly zeros and log(0) is
  # undefined. Sets how far below the smallest real value a zero lands.
  # Only used when transform: clr.
  clr_pseudocount: 1.0e-6
  # Relative abundance a taxon must exceed before it counts as present.
  # 0.0 = any non-zero value, which matches how min_prevalence counts.
  # Raise it (e.g. 1.0e-4) to ignore barcode bleed and other near-zero
  # detections. Only used when transform: presence.
  presence_threshold: 0.0
  # Build features only for samples that have at least one non-null
  # label. CV, the trainer and SHAP never touch an unlabelled sample, so
  # this is free unless you want the saved dataset to cover everything.
  labelled_only: false

  # Per-taxon intraclass correlation: what fraction of a taxon's variance
  # across samples is explained by knowing which study it came from.
  #   ICC ~ 1 -> flat inside every study, different between them. Knowing
  #             the bioproject tells you the abundance. That is a protocol
  #             artefact (primer bias, extraction kit, depth, a lab's
  #             contaminant), and a tree splitting on it is learning which
  #             study it is looking at -- worthless under bioproject_logo.
  #   ICC ~ 0 -> moves as much inside a study as across studies, so
  #             something other than batch is driving it.
  # Unsupervised: reads abundances and the grouping, never a label.
  # Always measured on relative abundance, whatever `transform` is set to:
  # it runs on the long table, before the pivot and before clr/presence,
  # so the number stays interpretable and comparable across transforms.
  # Runs after the prevalence filter, so it describes the taxa that will
  # actually reach the model rather than the whole long tail.
  icc:
    # false = compute nothing. Costs one group_by over the long table.
    enabled: false
    # Grouping column to measure against; must exist under groupings.
    group: bioproject
    # Write <features>_icc.tsv next to the streamed feature tables,
    # ranked by ICC so the study markers are at the top. Look at this
    # first -- it is the useful half of the feature.
    report: true
    # Drop taxa above this ICC. null = rank only, drop nothing.
    #
    # READ THE TABLE BEFORE SETTING THIS. Every label here carries 57-80%
    # of its variance between bioprojects, so a taxon that genuinely
    # predicts the label must also vary between studies and will also
    # score a high ICC. Variance structure alone cannot tell batch from
    # signal under that confound. Excluding named contaminants you can
    # see in the table is a safer move than a blind threshold.
    max_icc: null

  # Shadow features: a measured noise floor for the importance table.
  # A shadow is a real column shuffled across samples -- same values,
  # same sparsity, no relationship to any label -- so whatever importance
  # it earns is what the model hands out for nothing. Borrowed from
  # Boruta, without Boruta's ~100 forest fits.
  #
  # This is the comparison the importance report cannot otherwise make:
  # "the forest used 1,155 of 4,260 columns" and "1,155 columns the tree
  # had to split on something" look identical without a null.
  shadow:
    # Builds <set>_shad alongside each taxonomic set, holding every real
    # column PLUS the shadows (the comparison only means anything inside
    # one fit). The clean set is untouched. Name the _shad set in
    # cv.feature_set to actually train on it, e.g.
    #   cv: {feature_set: [tax_genus, tax_genus_shad]}
    enabled: false
    # How many shadow columns. More = a better-calibrated null; with far
    # fewer shadows than real columns, the best shadow is the max of
    # fewer draws and the report's `real>max` over-counts. ~2% of the
    # column count is cheap and usually enough.
    n: 200
    # Fixes which columns are copied and how they shuffle, so a rerun
    # reproduces the same null.
    seed: 1234

preprocessing:
  # Master switch for the QC steps below. false = use the data as given.
  enabled: false
  # Drop samples whose sequencing depth (megabase pairs column) is below
  # metadata_mbp_cutoff megabase pairs.
  metadata_qc: true
  # Fill missing taxa, convert to relative abundance, then drop samples with
  # coverage < profiles_cov_cutoff or dominated by a single taxon.
  profiles_qc: true
  # After QC keep only samples present in every component (recommended).
  sync_after: true
  metadata_mbp_cutoff: 15          # min megabase pairs per sample
  profiles_cov_cutoff: 0           # min total coverage per sample (0 = keep all)
  profiles_dominated_cutoff: 0.99  # drop sample if one taxon > this fraction
  profiles_rank: order             # rank at which the domination check is done

split:
  # Level 1: hold out a test set that is NEVER used for CV/model selection.
  holdout:
    # Which label to split on; null = create a holdout for every label.
    label: null
    # Fraction of samples held out as `test` (approximate when grouping set).
    test_size: 0.2
    # Continuous labels are cut into this many EQUAL-WIDTH bins (min..max
    # by np.linspace, not quantiles) and the test set is stratified across
    # them, so it spans the label's range. A skewed label therefore gets
    # sparse bins at the tails; lower n_bins if one comes out near-empty.
    n_bins: 5
    # ONE grouping column, or null.
    #   null        -> stratified random split; the same bioproject/region
    #                  can appear in both train and test.
    #   bioproject  -> every bioproject goes wholly to train or wholly to
    #                  test, i.e. the test set is UNSEEN groups. Use this to
    #                  measure generalisation to new studies/regions.
    # A list is not accepted: run the pipeline once per grouping instead.
    grouping: null
    # Alternative to `grouping`: split on COMMUNITY MEMBERSHIP instead of a
    # metadata column. Set a rank ('family' or 'f__') and the taxon at that
    # rank whose prevalence is nearest test_size defines the holdout -- the
    # samples carrying it (or lacking it, whichever lands nearer) become the
    # test set, so training never sees a community containing that taxon.
    # Needs the matching feature set (features.ranks must include the rank).
    # Only labelled samples are considered. null = use `grouping` instead.
    taxon_rank: null
    presence_threshold: 0.0   # a taxon counts as present above this value
    min_test_samples: 2       # refuse a taxon leaving fewer on either side
    random_state: 42
    # Recreate the split even if one already exists on the dataset.
    force: true
  # Level 2: CV folds, drawn from the holdout TRAIN samples only.
  cv:
    label: null                    # null = folds for every label
    n_folds: 5
    n_bins: 5                      # label stratification, as above
    # How to cut the groups into folds. One, or both as a list.
    #   kfold -> pack the groups into n_folds stratified folds (the
    #            default; one scheme per grouping, named <grouping>)
    #   logo  -> leave-one-group-out, sklearn's LeaveOneGroupOut: every
    #            group becomes its own validation fold, so the number of
    #            folds is the number of groups. Named <grouping>_logo.
    #            Needs a grouping, so `random` never gets a LOGO variant.
    # Both doubles the number of CV jobs, and LOGO fits one model per
    # group, so it suits a grouping with few, well-populated groups.
    methods: [kfold]
    # Refuse a LOGO scheme whose grouping has more usable groups than
    # this -- it would be that many CV iterations per model. Groups with
    # a single sample cannot be a validation fold (R2 needs 2+ points);
    # they stay in training for every iteration and do not count here.
    logo_max_groups: 50
    # Which fold schemes to build (each scheme = a different way to cut the
    # train samples into folds):
    #   all      -> `random` + one scheme per grouping column
    #   random   -> only the ungrouped baseline
    #   <column> -> only that grouping (plus nothing else)
    # Building schemes is cheap; use cv.scheme below to limit what is trained.
    grouping: all
    random_state: 42
    # true = folds come from holdout-train only (keep this true; false leaks
    # the test samples into model selection).
    use_holdout: true
    force: true
    # true  -> skip a scheme that cannot produce n_folds populated folds
    #          (e.g. a grouping with only 3 distinct values).
    # false -> keep it with however many folds it can make.
    strict: true

cv:
  # Stage 2 switch. false = stop after the holdout split and its
  # distribution plots; no CV, no best models, no holdout evaluation.
  # Use it to check the splits are sane before paying for the models.
  enabled: true
  # Models to evaluate. Short names: rf (random forest), gb (gradient
  # boosting), xgb / xgboost. Hyperparameters come from param_path.
  models:
    - rf
    - xgboost
  # run      -> evaluate EVERY parameter combination in param_path with CV
  #             and keep them all in cv_results (best is chosen per scheme).
  # run_grid -> sklearn GridSearchCV per model/scheme, one model fit per
  #             candidate. The winner per scheme goes on to the holdout, and
  #             every candidate is in cv_results/grid_results.csv.
  #             Point param_path at hyperparameters.yaml as well: mode alone
  #             searches whatever single values parameters.yaml holds.
  mode: run
  # YAML of per-model parameter lists (see parameters.yaml in the repo).
  param_path: parameters.yaml
  # run: workers across feature/label/scheme combinations.
  # run_grid: workers per GridSearchCV; combinations run one after another.
  # null = use all detected CPU cores.
  n_jobs: null
  # Restrict CV to a subset. null = everything the split stage produced.
  label: null                      # e.g. ph, or [ph, temperature]
  # Schemes to actually train, e.g. [random, bioproject, ecoregion].
  # Keep `random` as the leaky baseline to compare grouped schemes against.
  scheme: null
  feature_set: null                # e.g. tax_order, or [tax_order, tax_genus]

# Stage 7 switch. false = stop after CV: best_models/ and cv_results/ are
# written (plus CV bar plots if visualise.enabled) and the log lists the best
# combination per label/scheme, but nothing is refit or scored on the test
# set. The holdout split is still created and saved under splits/, so a later
# run with the same split.* settings evaluates on the identical test samples.
# Score the model that is fitted on the WHOLE training pool, rather than
# on k-1 folds like every CV number. That model already exists -- the CV
# stage fits it after cross_validate and currently only reads feature
# importances off it -- so this scores it rather than training anything.
#
# Writes <base_dir>/final_fit/:
#   full_fit_metrics.csv      one row per label x CV scheme
#   full_fit_importances.csv  top_n features of that full-pool fit
#
# Columns worth knowing:
#   in_sample_r2   the fit scored on the rows it trained on. A CEILING,
#                  not a performance estimate -- a random forest lands
#                  near 1.0 on almost anything.
#   oob_r2         out-of-bag R2: each row scored by the trees that did
#                  not draw it. Genuinely held out, and free because it
#                  rides along with the fit. Random-forest only; an
#                  XGBoost row leaves it empty.
#   overfit_gap    in_sample_r2 minus the pooled CV score. How much of
#                  the in-sample fit is memorisation.
#
# READ oob_r2 LIKE A RANDOM SPLIT. Bootstrap draws rows, not groups, so
# a row's own study is nearly always among the trees scoring it. Where
# study identity predicts the label -- which is this data -- OOB will
# look like the `random` scheme and far better than bioproject_logo. It
# says the fit converged, not that it will transfer to a new study.
#
# Independent of holdout_evaluation: this describes the training fit, so
# it still runs with the holdout stage switched off.
final_fit:
  # false = compute nothing, which is the default.
  enabled: false
  # Ask for the out-of-bag score. Costs an OOB pass on each fit rather
  # than a refit; set false to skip it and keep in-sample only.
  oob: true
  # Features listed in full_fit_importances.csv per label x scheme.
  top_n: 20

holdout_evaluation:
  enabled: true

# Snakemake only. One extra rule at the end of a sweep, reading the CV
# exports that already exist -- no model is refitted or unpickled, so it
# costs seconds. Writes <base>/feature_report/:
#   rank_comparison.tsv           pooled R2 per rank, coarse -> fine, so
#                                 you can see whether genus beats order
#   importance_concentration.tsv  how many features carry each share of
#                                 the total importance, and how many the
#                                 model never split on at all
#   importance_kept_taxa.tsv      those features, named, with their
#                                 cumulative share -- the LARGEST
#                                 coverage below; the smaller sets are
#                                 nested inside it
#   feature_report.txt            both tables, readable
# Run it alone against any finished output directory:
#   python scripts/rank_feature_report.py --root <base>
# Read by scripts/prune_iterate_cv.py only -- not part of the Snakemake
# DAG. Each round runs CV, drops the features whose importance came back
# exactly zero (the model never split on them), and runs the same CV
# again on what is left. It stops early when a round drops nothing.
# Unlike feature_report this costs real compute, so it is off by default;
# --iterations on the command line overrides `enabled` either way.
#   python scripts/prune_iterate_cv.py --config pipeline.yaml \
#       --dataset <base>/prepared --splits <base>/<run>/splits \
#       --label ph --scheme bioproject_logo --iterations 3 --out out/prune
# The scores it reports come from the same folds the pruning was derived
# from, so they are optimistic; use them to see how much can be dropped
# before the score moves, and the holdout for the honest number.
feature_pruning:
  enabled: false
  # Prune/re-run rounds after the baseline. 0 = baseline CV only.
  iterations: 1
  # What a round drops.
  #   zero     -> (default) keep every feature with importance above
  #               zero, i.e. drop only what the model never split on.
  #               Settles after a round or two.
  #   coverage -> keep the smallest set reaching `coverage` of the total
  #               importance, the count the feature report calls
  #               n_for_95pct. Much more aggressive, and it does drop
  #               features the model used. It takes a fraction of
  #               whatever is left every round, so it keeps shrinking
  #               until min_features stops it -- set that on purpose.
  prune: zero
  # Only read when prune: coverage.
  coverage: 0.95
  # Never let a round leave fewer features than this.
  min_features: 10

feature_report:
  enabled: true
  # Shares of total importance to report, one column each. The largest
  # also decides n_dropped and which taxa land in the kept-taxa file.
  coverage: [0.5, 0.9, 0.95]
  # Features printed per combination in the text report; the TSV is full.
  top: 25

outputs:
  # Everything below is written under here (also overridable with
  # --output-dir on the command line):
  #   splits/<label>/holdout.csv, cv_<scheme>.csv   sample assignments
  #   cv_results/                                   all CV results (sorted)
  #   best_models/<label>/<scheme>/ + summary       CV winner per scheme
  #   holdout/<label>/<scheme>/ + holdout_summary   final models + metrics
  base_dir: out/pipeline
  # Where the split assignment CSVs go. null = base_dir/splits
  splits_dir: null
  # Also pickle every CV combination under cv_results/models/ (large!).
  # The best model per scheme is always saved under best_models/ regardless.
  cv_save_models: false
  # Also write cv_results/results_folds.csv (one row per fold; the same
  # numbers are inside results.ndjson).
  cv_fold_table: false
  # Save the fully prepared dataset (features + splits) so it can be reloaded
  # with Dataset.load() without recomputing. e.g. /abs/path/dataset. null = skip
  save_dataset_path: null
  # Pack save_dataset_path into a single .tar.gz instead of a directory.
  save_dataset_compress: false

visualise:
  # Write figures: CV bar charts, holdout diagnostics (pred vs obs,
  # residuals), feature-importance bars, and SHAP plots when shap.enabled.
  enabled: false
  formats:                         # any of png, svg, pdf, eps
    - png
  top_n: 20                        # features shown in importance plots
  # Stage 1 figure: label distribution in holdout train vs test, side by
  # side on shared bins, so an unrepresentative split shows up before
  # anything is trained. Written to <base_dir>/split_visualisations/.
  holdout_distribution:
    enabled: true
    # Column to stack the bars by. "auto" = whatever defined the holdout
    # (the grouping column, or holdout_taxon_presence for a taxon split);
    # a column name to force one; null for no stacking.
    grouping: auto
    bins: 30
    # One row of panels per statistic. count = raw numbers (the 80/20
    # size difference stays visible); probability = both sides on one
    # scale so the shapes can be compared. A single string also works.
    stat: [count, probability]

# Optional SHAP attribution on each holdout TEST split. Requires the `shap`
# package: run with `pixi run -e shap python scripts/run_cv_to_final_eval.py ...`
# (or `pixi run -e full ...`). If shap is missing the run continues with a
# warning. Per holdout model it writes shap_summary.csv (mean_abs_shap,
# mean_shap, direction) and shap_values.csv, adds `shap_top_features` /
# `shap_top_features_direction` to holdout_metrics.json, and with
# visualise.enabled a direction-coloured bar plot and a beeswarm.
# direction = Spearman(abundance, SHAP): >0 pushes the label up, <0 down.
shap:
  enabled: false
  # Background samples for the explainer; caps compute on large test sets.
  max_background: 100
  # Features listed in holdout_metrics.json and shown in the SHAP plots.
  top_n: 20

# How a sweep enumerates its runs (scripts/run_holdout_sweep.py and
# workflow/Snakefile). Give ONE of these; `pairs` wins if both appear.
# scripts/sweep_transforms.py reads more keys from here; see
# scripts/sweep_transforms.example.yaml.
sweep:
  # Cross-product: every grouping is tried against every label.
  #   random          stratified random holdout (the positive control)
  #   <column>        group-aware holdout on that metadata column
  #   "taxon:<rank>"  holdout by community membership at that rank --
  #                   QUOTE it: inside [ ] an unquoted colon is a YAML error
  holdout_groupings: []

  # ...or pair each label with its own holdout grouping. One run per pair,
  # pinned to that label at every stage, written to
  # <base_dir>/holdout_<grouping>__<label>/. CV still covers every scheme.
  # A label may name a LIST of groupings; each becomes its own run, so you
  # can add one later without disturbing the runs already on disk.
  # pairs:
  #   geo_ph: [organism, bioproject]   # -> two runs
  #   geo_temperature: realm           # -> one run
  #   ph: "taxon:family"

  # Summaries ACCUMULATE. `collate` rebuilds the sweep TSVs from every
  # holdout_*/ directory under base_dir, not just the runs of this
  # invocation, so adding a grouping and re-running extends the tables
  # instead of replacing them. The flip side: deleting a run directory is
  # how you drop it from the summaries.

  # Retries and per-rule resources for the Snakemake workflow.
  mem_scale: 2.0
  retries: {prepare: 3}
